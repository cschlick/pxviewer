name: release-windows

# Builds the Windows installer: an NSIS setup.exe containing the conda-packed
# environment — same "ship the whole env" model as the macOS dmg. Runs on
# demand or when a v* tag is pushed — tag pushes attach the exe to the release
# (whichever of the release workflows finishes first creates it).
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# or Actions → release-windows → Run workflow for a test build (artifact only).

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# the tag path creates a release and uploads the installer to it
permissions:
  contents: write

jobs:
  installer:
    name: Windows installer (x86_64)
    runs-on: windows-latest
    # conda solve + 5 GB env link + solid-lzma NSIS over ~300k files.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # The build script needs a conda binary to create the app env and its
      # bootstrapped tools; it does not need the pxviewer env itself.
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest

      # NSIS ships in the windows runner image; install it only if absent.
      - name: Ensure makensis
        shell: bash
        run: |
          command -v makensis >/dev/null 2>&1 && exit 0
          [ -x "/c/Program Files (x86)/NSIS/makensis.exe" ] && exit 0
          choco install nsis -y

      # The recipe bundles frontend/build/index.js into the package; runners
      # carry a system node, so npm ci + the vendored esbuild build it.
      - name: Frontend bundle
        run: |
          npm --prefix frontend ci
          ./scripts/build_frontend.sh

      - name: Build installer
        shell: bash
        run: bash scripts/build_windows_installer.sh

      - uses: actions/upload-artifact@v4
        with:
          name: pxviewer-windows-installer
          path: build/windows-installer/*.exe

      - name: Attach installer to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --generate-notes
          gh release upload "$tag" build/windows-installer/*.exe --clobber
