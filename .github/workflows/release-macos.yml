name: release-macos

# Builds the double-clickable installer: pxviewer.app (a conda-packed env inside
# a real bundle) wrapped in a .dmg. Runs on demand or when a v* tag is pushed —
# tag pushes also attach the dmg to a GitHub Release.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# or Actions → release-macos → Run workflow for a test build (artifact only).

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# the tag path creates a release and uploads the dmg to it
permissions:
  contents: write

jobs:
  dmg:
    name: macOS dmg (arm64)
    runs-on: macos-latest
    # rattler-build's test-env solve + 7 GB env link/pack + single-threaded
    # lzfse dmg compression: ~90 min observed locally. Leave headroom.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # The build script needs a conda binary to create the app env and to run
      # its bootstrapped tools; it does NOT need the pxviewer env itself — the
      # recipe builds the package and the env is created fresh from it.
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest

      # The recipe bundles frontend/build/index.js into the package; runners
      # carry a system node, so npm ci + the vendored esbuild build it without
      # the dev env.
      - name: Frontend bundle
        run: |
          npm --prefix frontend ci
          ./scripts/build_frontend.sh

      # Optional signing: present the secrets and the dmg ships signed +
      # notarized; absent, the build stays ad-hoc (Gatekeeper warns on
      # download). Secrets used: APPLE_CERTIFICATE (base64 .p12 of the
      # Developer ID Application cert), APPLE_CERTIFICATE_PASSWORD,
      # APPLE_SIGNING_IDENTITY, and either NOTARY_KEY{,_ID,_ISSUER} (App Store
      # Connect API key) or APPLE_ID/APPLE_TEAM_ID/APPLE_APP_SPECIFIC_PASSWORD.
      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        if: env.APPLE_CERTIFICATE != ''
        run: |
          CERT="$RUNNER_TEMP/developer-id.p12"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT"
          security create-keychain -p build build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p build build.keychain
          security set-keychain-settings build.keychain
          security import "$CERT" -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          # Without this the first codesign pops a GUI prompt and hangs CI.
          security set-key-partition-list -S apple-tool:,apple: \
            -k build build.keychain

      - name: Build pxviewer.app + dmg
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_KEY_FILE: ${{ runner.temp }}/notary-key.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [[ -n "${{ secrets.NOTARY_KEY_B64 }}" ]]; then
            echo "${{ secrets.NOTARY_KEY_B64 }}" | base64 --decode > "$NOTARY_KEY_FILE"
          fi
          ./scripts/build_macos_app.sh

      - uses: actions/upload-artifact@v4
        with:
          name: pxviewer-macos-dmg
          path: build/macos-app/*.dmg

      - name: Attach dmg to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --generate-notes
          gh release upload "$tag" build/macos-app/*.dmg --clobber
